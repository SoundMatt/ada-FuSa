name: CI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: DCO Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on all PR commits
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          failed=0
          while IFS= read -r sha; do
            body=$(git log --format=%B -1 "$sha")
            if ! printf '%s\n' "$body" | grep -qE '^Signed-off-by: .+ <.+>'; then
              echo "ERROR: commit $sha missing Signed-off-by trailer"
              git log --oneline -1 "$sha"
              failed=1
            fi
          done < <(git log --format='%H' "${base}".."${head}")
          exit $failed

  # macOS/Windows GNAT toolchain availability has not been verified for
  # ada-FuSa (see README "Known limitations") -- CI targets Linux only
  # for now, unlike the other six x-FuSa tools' macOS+Linux matrices.
  build-and-test:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GNAT toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat gprbuild gcovr

      - name: Build
        run: gprbuild -p -P adafusa.gpr

      - name: Sanity check
        run: bin/adafusa version

      - name: Build unit tests
        run: gprbuild -p -P tests/tests.gpr

      - name: Run unit tests
        run: bin/run_tests

      - name: Coverage gate (>= 80% line coverage)
        run: |
          gcovr --root . --filter 'src/' --exclude 'src/adafusa_main.adb' \
                --print-summary --fail-under-line 80

      - name: Tool qualification
        run: bin/adafusa qualify

      - name: Self-check (dogfood adafusa against its own source)
        run: |
          bin/adafusa init --name ada-fusa --standard generic
          bin/adafusa check --format json --output fusa-report.json
        continue-on-error: true

      - name: Generate evidence artifacts
        run: |
          bin/adafusa release
          bin/adafusa audit-pack

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evidence-artifacts
          path: |
            fusa-report.json
            qualify-report.json
            sbom.json
            audit-pack.zip
          if-no-files-found: warn
          retention-days: 90

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ghcr.io/soundmatt/ada-fusa:latest
          build-args: |
            VERSION=0.1.0
            SPEC_VERSION=1.11
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
