name: CI

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: DCO Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on all PR commits
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          failed=0
          while IFS= read -r sha; do
            body=$(git log --format=%B -1 "$sha")
            if ! printf '%s\n' "$body" | grep -qE '^Signed-off-by: .+ <.+>'; then
              echo "ERROR: commit $sha missing Signed-off-by trailer"
              git log --oneline -1 "$sha"
              failed=1
            fi
          done < <(git log --format='%H' "${base}".."${head}")
          exit $failed

  # Windows GNAT/Alire toolchain viability in GitHub Actions is still an
  # open question (see #33) -- CI matrix is Linux+macOS for now, one leg
  # short of the other six x-FuSa tools' Linux+macOS+Windows matrices.
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install GNAT toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnat gprbuild gcovr

      - name: Install GNAT toolchain via Alire (macOS)
        if: runner.os == 'macOS'
        run: |
          # GNAT is not distributed via Homebrew, so bootstrap via Alire
          # instead -- the same toolchain-management approach this
          # project's local macOS development setup already uses.
          gh release download --repo alire-project/alire \
            --pattern '*universal-macos.zip' --output /tmp/alr.zip
          unzip -q /tmp/alr.zip -d /tmp/alr
          echo "/tmp/alr/bin" >> "$GITHUB_PATH"
          export PATH="/tmp/alr/bin:$PATH"
          alr toolchain --select gnat_native gprbuild
          for d in "$HOME/.local/share/alire/toolchains"/*/bin; do
            echo "$d" >> "$GITHUB_PATH"
          done
          brew install gcovr
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build
        run: gprbuild -p -P adafusa.gpr

      - name: Sanity check
        run: bin/adafusa version

      - name: Build unit tests
        run: gprbuild -p -P tests/tests.gpr

      - name: Run unit tests
        run: bin/run_tests

      - name: Coverage gate (>= 80% line coverage)
        run: |
          gcovr --root . --filter 'src/' --exclude 'src/adafusa_main.adb' \
                --print-summary --fail-under-line 80

      - name: Tool qualification
        run: bin/adafusa qualify

      - name: Self-check (dogfood adafusa against its own source)
        run: |
          bin/adafusa init --name ada-fusa --standard generic
          bin/adafusa check --format json --output fusa-report.json

      - name: Requirement traceability gate (100% req + function coverage)
        run: bin/adafusa trace --req-coverage 100 --func-coverage 100

      - name: Generate evidence artifacts
        run: |
          bin/adafusa release
          bin/adafusa audit-pack

      - name: Upload evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evidence-artifacts-${{ matrix.os }}
          path: |
            fusa-report.json
            qualify-report.json
            sbom.json
            audit-pack.zip
          if-no-files-found: warn
          retention-days: 90

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ghcr.io/soundmatt/ada-fusa:latest
          build-args: |
            VERSION=0.1.0
            SPEC_VERSION=1.11
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
